  <path d="M31.2 46 L31.2 59.5 L32 58.5 L32.8 59.5 L32.8 46 Z" fill="#DC2626" />

  <!-- Outer Holy Fire / Flame -->
  <path d="M32 4 C34.5 10.5, 42 14.5, 43.5 22.5 C45 30, 39.5 36.5, 35.5 40.5 C33.5 42, 30.5 42, 28.5 40.5 C24.5 36.5, 19 30, 20.5 22.5 C22 14.5, 29.5 10.5, 32 4 Z" fill="url(#flameGrad)" />

  <!-- Inner Spark Flame -->
  <path d="M32 14 C33.8 18.5, 38 21.5, 37.5 27.5 C37 32.5, 34.5 36, 32 37.5 C29.5 36, 27 32.5, 26.5 27.5 C26 21.5, 30.2 18.5, 32 14 Z" fill="url(#innerFlameGrad)" />

