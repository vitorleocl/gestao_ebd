<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="flameGrad" x1="32" y1="4" x2="32" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="35%" stop-color="#F97316" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FDE047" />
    </linearGradient>
    <linearGradient id="innerFlameGrad" x1="32" y1="14" x2="32" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="60%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>
    <linearGradient id="bibleCover" x1="4" y1="44" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#312E81" />
      <stop offset="50%" stop-color="#4338CA" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="pageGrad" x1="32" y1="42" x2="32" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
  </defs>

  <!-- Bible Base / Cover -->
  <path d="M4 48 C13 44, 23 44, 32 47 C41 44, 51 44, 60 48 L60 59 C51 55, 41 55, 32 58 C23 55, 13 55, 4 59 Z" fill="url(#bibleCover)" stroke="#1E1B4B" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- Left Page -->
  <path d="M6 46.5 C14 42.8, 23 42.8, 32 46 L32 56.5 C23 53.5, 14 53.5, 6 57 Z" fill="url(#pageGrad)" stroke="#E2E8F0" stroke-width="0.8" stroke-linejoin="round"/>
  <!-- Right Page -->
