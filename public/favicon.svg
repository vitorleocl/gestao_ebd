  <!-- Scripture text lines on pages -->
  <line x1="11" y1="48" x2="27" y2="49" stroke="#94A3B8" stroke-width="1.2" stroke-linecap="round" opacity="0.8" />
  <line x1="11" y1="51.5" x2="27" y2="52.5" stroke="#94A3B8" stroke-width="1.2" stroke-linecap="round" opacity="0.8" />
  <line x1="37" y1="49" x2="53" y2="48" stroke="#94A3B8" stroke-width="1.2" stroke-linecap="round" opacity="0.8" />
  <line x1="37" y1="52.5" x2="53" y2="51.5" stroke="#94A3B8" stroke-width="1.2" stroke-linecap="round" opacity="0.8" />

